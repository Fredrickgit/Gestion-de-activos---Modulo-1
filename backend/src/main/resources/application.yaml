server:
  # Render inyecta PORT (por defecto 10000). En local se usa 8080.
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: Gestion-de-activos--Modulo-1
  datasource:
    # Prioridad: DB_URL (JDBC explícita) > DB_HOST/DB_PORT/DB_NAME > localhost.
    # Si el servicio se despliega con la URL de Render (postgresql://...),
    # RenderDatabaseEnvironmentPostProcessor la convierte a jdbc:postgresql://...
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion_activos_modulo1}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GestionActivosHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:infrastructure/database/connection/migrations
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:m1-activos-consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      # En Render (plan gratuito) no hay broker Kafka disponible.
      # Se desactiva con KAFKA_LISTENERS_AUTO_STARTUP=false para que la app
      # arranque sin intentar conectarse a localhost:9092.
      auto-startup: ${KAFKA_LISTENERS_AUTO_STARTUP:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin}

outbox:
  relay:
    # El relay publica eventos pendientes en Kafka. En Render sin Kafka se
    # desactiva con OUTBOX_RELAY_ENABLED=false.
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    delay-ms: ${OUTBOX_RELAY_DELAY_MS:5000}

external:
  validation:
    enabled: ${EXTERNAL_VALIDATION_ENABLED:true}
  modulo2:
    base-url: ${MODULO2_BASE_URL:http://localhost:8082}
    connect-timeout-ms: ${MODULO2_CONNECT_TIMEOUT:2000}
    read-timeout-ms: ${MODULO2_READ_TIMEOUT:3000}
  modulo3:
    base-url: ${MODULO3_BASE_URL:http://localhost:8083}
    connect-timeout-ms: ${MODULO3_CONNECT_TIMEOUT:2000}
    read-timeout-ms: ${MODULO3_READ_TIMEOUT:3000}
