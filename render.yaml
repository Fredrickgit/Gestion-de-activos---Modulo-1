# Blueprint de Render (opcional pero recomendado).
# Permite crear el servicio web y la base de datos con un solo clic:
#   Render Dashboard -> New -> Blueprint -> seleccionar el repositorio.
#
# El servicio se construye con backend/Dockerfile y el contexto backend/.
databases:
  - name: gestion-activos-db
    plan: free
    region: oregon
    databaseName: gestion_activos_modulo1
    user: gestion_activos

services:
  - type: web
    name: gestion-de-activos-modulo-1
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    envVars:
      # Credenciales de la base de datos inyectadas por Render.
      - key: DB_HOST
        fromDatabase:
          name: gestion-activos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestion-activos-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gestion-activos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: gestion-activos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestion-activos-db
          property: password

      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "20.221.238.105:9092"
      - key: MODULE2_KAFKA_CONSUMER_GROUP
        value: "module1-inventario"
      - key: MODULE2_KAFKA_LISTENER_AUTO_STARTUP
        value: "true"
      - key: KAFKA_LISTENERS_AUTO_STARTUP
        value: "false"
      - key: OUTBOX_RELAY_ENABLED
        value: "false"
      - key: EXTERNAL_VALIDATION_ENABLED
        value: "false"
      # Validación REST de M3 independiente de M2 y de los listeners Kafka.
      - key: MODULO2_VALIDATION_ENABLED
        value: "false"
      - key: MODULO3_VALIDATION_ENABLED
        value: "true"
      - key: MODULO3_BASE_URL
        value: "https://gestionu-mod-3.onrender.com"

      # Credenciales de la API (HTTP Basic). Se piden al crear el Blueprint.
      - key: SECURITY_USER
        sync: false
      - key: SECURITY_PASSWORD
        sync: false
      # Origen del sitio estático. Si cambias el nombre del servicio frontend,
      # actualiza este valor.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gestion-de-activos-modulo-1-0yu6.onrender.com"

  # Frontend estático (Vite + React). Render ejecuta el build y publica dist/.
  - type: web
    name: gestion-de-activos-modulo-1-0yu6
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # URL pública real del Web Service del backend.
      - key: VITE_API_BASE_URL
        value: https://gestion-de-activos-modulo-1.onrender.com/api/v1
      # Credenciales HTTP Basic. Configúralas en el dashboard de Render.
      - key: VITE_API_USERNAME
        sync: false
      - key: VITE_API_PASSWORD
        sync: false
      - key: VITE_API_TIMEOUT_MS
        value: "60000"
      - key: VITE_DEMO_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
